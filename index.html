:root{
  --navy:#1d3d4d; --gold:#cdaf85;
  --bg:#f6f5f2; --card:#fff; --ink:#1a3644; --muted:#5d6f7a; --line:#e3dfd7;
  --brand:#1d3d4d; --accent:#1d3d4d; --focus:#1d3d4d; --primary-bg:#1d3d4d; --primary-ink:#cdaf85;
  --ok:#1f7a4d; --ok-bg:#e3f4ea; --warn:#7a5a1e; --warn-bg:#f6ecd9;
  --info:#1d3d4d; --info-bg:#dfe9ee; --bad:#a3271f; --bad-bg:#fbe6e3; --idle:#51616b; --idle-bg:#eceeed;
  --bubble-ink:#fff;
  --r:12px; --shadow:0 1px 2px rgba(29,61,77,.06),0 1px 3px rgba(29,61,77,.08);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#10222b; --card:#18313d; --ink:#eef1f2; --muted:#9fb1ba; --line:#2b4757;
  --brand:#0e1f27; --accent:#cdaf85; --focus:#cdaf85; --primary-bg:#cdaf85; --primary-ink:#1d3d4d;
  --ok:#7fd3a4; --ok-bg:#143a28; --warn:#e7cfa6; --warn-bg:#3b3220;
  --info:#bcd3de; --info-bg:#234656; --bad:#ff9d96; --bad-bg:#4a1e1d; --idle:#b4c1c8; --idle-bg:#243d4a;
  --shadow:none; --bubble-ink:#1d3d4d;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Montserrat",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
header.top{background:var(--brand);color:#fff;position:sticky;top:0;z-index:5}
.bar{max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-size:20px;letter-spacing:.2px}
.logo svg{width:30px;height:30px;flex:none}
.logo b{font-weight:700} .logo i{font-style:normal;font-weight:300;color:var(--gold)}
.logo small{font-size:13px;font-weight:400;opacity:.75;border-left:1px solid rgba(255,255,255,.3);padding-left:10px;margin-left:2px}
.spacer{flex:1}
.pill{font-size:12px;padding:3px 10px;border-radius:999px;background:rgba(205,175,133,.18);color:var(--gold)}
.ghost{background:transparent;color:var(--gold);border:1px solid rgba(205,175,133,.55);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:14px}
nav.tabs{max-width:1100px;margin:0 auto;padding:0 8px;display:flex;gap:2px;overflow-x:auto}
nav.tabs button{background:none;border:0;color:rgba(255,255,255,.72);padding:10px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-current="page"]{color:#fff;border-bottom-color:var(--gold);font-weight:600}
main{max-width:1100px;margin:0 auto;padding:18px 16px 40px}
.banner{background:var(--warn-bg);color:var(--warn);border-left:4px solid var(--gold);border-radius:0 var(--r) var(--r) 0;padding:10px 14px;font-size:14px;margin-bottom:18px}
h1{font-size:28px;font-weight:300;letter-spacing:-.2px;margin:4px 0 14px}
h1 strong{font-weight:700}
h2{font-size:17px;font-weight:600;margin:24px 0 10px}
.muted{color:var(--muted)} .small{font-size:13.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:14px 16px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.tile{padding:12px 14px;cursor:pointer;text-align:left;width:100%;border-top:3px solid var(--line)}
.tile b{display:block;font-size:30px;font-weight:300;line-height:1.1}
.tile.on{border-top-color:var(--gold);outline:2px solid var(--focus);outline-offset:-1px}
.tile.on b{font-weight:700}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
select,input[type=text],input[type=email],input[type=tel],input[type=date],input[type=number],textarea{
  background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;font-size:16px}
.filters select{width:auto;min-width:200px}
.rows>*+*{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:118px 1fr auto;gap:12px;align-items:center;padding:12px 16px;width:100%;background:none;border:0;text-align:left;cursor:pointer}
.row:hover{background:rgba(205,175,133,.12)}
.when b{display:block;font-weight:600;font-variant-numeric:tabular-nums}
.when span{font-size:12px;color:var(--muted)}
.when.late span{color:var(--bad);font-weight:600}
.what b{display:block;font-weight:600}
.state{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.s-idle{background:var(--idle-bg);color:var(--idle)} .s-info{background:var(--info-bg);color:var(--info)}
.s-warn{background:var(--warn-bg);color:var(--warn)} .s-ok{background:var(--ok-bg);color:var(--ok)}
.s-bad{background:var(--bad-bg);color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.eng{padding:14px 16px;text-align:left;cursor:pointer;width:100%;border-left:4px solid var(--gold)}
.eng:hover{background:rgba(205,175,133,.10)}
.eng h3{margin:0 0 2px;font-size:17px;font-weight:600}
.meter{height:6px;background:var(--idle-bg);border-radius:99px;overflow:hidden;margin:10px 0 6px}
.meter i{display:block;height:100%;background:var(--gold)}
.btn{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 13px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--primary-bg);border-color:var(--primary-bg);color:var(--primary-ink);font-weight:600}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.link{border:0;background:none;color:var(--accent);padding:4px 0;font-weight:500}
.head{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;margin-bottom:8px}
.head h1{margin:0;flex:1;min-width:200px}
.kv{display:grid;grid-template-columns:180px 1fr;gap:6px 14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.list{margin:0;padding-left:18px}
.item{display:flex;gap:10px;align-items:center;padding:10px 16px;flex-wrap:wrap}
.item .grow{flex:1;min-width:160px}
.missing{color:var(--bad);font-weight:600}
dialog{border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:14px;padding:0;background:var(--card);color:var(--ink);width:min(680px,94vw);max-height:92vh}
dialog::backdrop{background:rgba(16,34,43,.6)}
.dlg{padding:18px;display:grid;gap:12px}
.dlg h2{margin:0;font-size:20px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fields .wide{grid-column:1/-1}
label{display:grid;gap:4px;font-size:13.5px;color:var(--muted)}
label>*{color:var(--ink)}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.err{color:var(--bad);font-size:14px;min-height:1em}
.doc{line-height:1.65}
.doc h1,.doc h2,.doc h3,.doc h4{margin:18px 0 6px;font-weight:600}
.doc h2{font-size:20px} .doc h3{font-size:17px}
.doc table{border-collapse:collapse;width:100%;font-size:13.5px;display:block;overflow-x:auto}
.doc th,.doc td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.doc th{background:var(--idle-bg)}
.doc .draft{border-left:4px solid var(--gold);background:var(--warn-bg);padding:10px 14px;border-radius:0 8px 8px 0;margin:12px 0;white-space:pre-wrap}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--navy);color:#fff;border-left:4px solid var(--gold);padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:92vw;z-index:20}
#toast.show{opacity:1}
.chat{padding:14px;display:flex;flex-direction:column;gap:10px;min-height:220px;margin-bottom:12px}
.m{display:flex} .m>div{max-width:min(660px,90%);padding:10px 14px;border-radius:14px;overflow-wrap:anywhere}
.m.u{justify-content:flex-end} .m.u>div{background:var(--primary-bg);color:var(--bubble-ink);border-bottom-right-radius:4px}
.m.a>div{background:var(--idle-bg);border-bottom-left-radius:4px}
.m.a p:first-child{margin-top:0} .m.a p:last-child{margin-bottom:0} .m.a ul{margin:6px 0;padding-left:18px}
.prop{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:0 10px 10px 0;padding:10px 12px;margin-top:10px}
.prop ul{margin:6px 0 10px;padding-left:18px}
.composer{padding:12px} .composer textarea{resize:vertical;min-height:84px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.calhead{display:flex;align-items:center;gap:8px;padding:10px 16px;flex-wrap:wrap}
.calhead h2{margin:0;flex:1;min-width:150px}
.calhead h2::first-letter{text-transform:uppercase}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line)}
.dow{font-size:11px;color:var(--muted);padding:6px 8px;text-transform:uppercase;letter-spacing:.6px}
.day{min-height:96px;border-top:1px solid var(--line);border-left:1px solid var(--line);padding:4px;display:flex;flex-direction:column;gap:3px;min-width:0}
.day:nth-child(7n+1){border-left:0}
.calgrid.short .day{min-height:74px}
.day.out{background:rgba(127,127,127,.06)} .day.out .num{opacity:.45}
.day .num{align-self:flex-start;background:none;border:0;border-radius:99px;min-width:26px;height:26px;padding:0 6px;cursor:pointer;font-weight:600;font-size:13px}
.day.today .num{background:var(--primary-bg);color:var(--primary-ink)}
.day.sel{box-shadow:inset 0 0 0 2px var(--gold)}
.tag{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--ink);font-size:11.5px;font-weight:600;padding:2px 6px;border-radius:0 5px 5px 0;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag.done{opacity:.5;text-decoration:line-through}
.tag.late{box-shadow:inset 0 0 0 1px var(--bad)}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--line);font-size:12.5px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.c0{--c:#1d3d4d} .c1{--c:#a8843f} .c2{--c:#2f7f86} .c3{--c:#7a4b7c} .c4{--c:#3f7d4f} .c5{--c:#b0522d}
@media (prefers-color-scheme:dark){.c0{--c:#8fb3c4} .c1{--c:#cdaf85} .c2{--c:#6fc3ca} .c3{--c:#c08fc2} .c4{--c:#7fd3a4} .c5{--c:#e59368}}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
header.top :focus-visible{outline-color:var(--gold)}
@media (max-width:700px){
  .tiles{grid-template-columns:repeat(2,1fr)}
  .row{grid-template-columns:1fr;row-gap:4px}
  .when{display:flex;gap:8px;align-items:baseline}
  .when b{display:inline}
  .row .state{grid-column:1;justify-content:flex-start}
  .kv{grid-template-columns:1fr} .kv dt{margin-top:8px}
  .fields{grid-template-columns:1fr}
  .filters select{width:100%}
  .logo small{display:none}
  .day{min-height:52px;padding:3px 2px;align-items:center}
  .calgrid.short .day{min-height:52px}
  .day .num{align-self:center}
  .tag{font-size:0;padding:0;height:6px;width:70%;border-left:0;border-radius:3px;background:var(--c)}
  .dow{padding:6px 2px;text-align:center}
  h1{font-size:24px}
}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <div class="logo"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="1.5" y="1.5" width="29" height="29" fill="none" stroke="#fff" stroke-width="2.4"/><polygon points="6,25 11.5,25 19,14.5 13.5,14.5" fill="#fff"/><rect x="20.5" y="8" width="4.2" height="17" fill="#cdaf85"/></svg><div class="wm"><b>Audit</b><i>Lab</i></div><small>Revisione</small></div>
    <div class="spacer"></div>
    <span class="pill" id="modo"></span>
    <button class="ghost" id="btnGate">Schermata di accesso</button>
  </div>
  <nav class="tabs" aria-label="Sezioni">
    <button data-nav="scadenze">Scadenze</button>
    <button data-nav="incarichi">Incarichi</button>
    <button data-nav="assistente">Assistente</button>
  </nav>
</header>
<main id="app" tabindex="-1"></main>
<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>/* Configurazione: sta in config.js accanto alla pagina, cosi' gli aggiornamenti non la toccano. Senza, la pagina mostra i dati di esempio. */
if (location.protocol.startsWith("http")) document.write('<script src="config.js"><\/script>');
</script>

<script>
"use strict";
/* ============================================================
   AuditLab · Revisione — interfaccia.
   Lo strato dei dati (Archivio) ha due realizzazioni: quella di
   esempio, qui sotto, e quella collegata a Google Drive, che
   espone gli stessi metodi. L'interfaccia non sa quale sta usando.
   ============================================================ */

const TIPI = {
  revisione_legale:    {nome: "Revisione legale",       prefisso: "SOC"},
  revisione_volontaria:{nome: "Revisione volontaria",   prefisso: "VOL"},
  ets:                 {nome: "Ente del Terzo settore", prefisso: "ETS"},
  ente_locale:         {nome: "Ente locale",            prefisso: "EL"},
};
const STATI = {
  "da fare":              {classe: "s-idle", nota: "Nessuna richiesta ancora generata"},
  "richiesta pronta":     {classe: "s-info", nota: "Richiesta documentale pronta: in attesa dei documenti"},
  "in coda":              {classe: "s-warn", nota: "Catena avviata: parte entro mezz'ora"},
  "catena eseguita":      {classe: "s-ok",   nota: "Lavoro completato: leggere il riesame"},
  "errore":               {classe: "s-bad",  nota: "Catena interrotta: vedere la mail di avviso"},
  "precedente all'avvio": {classe: "s-idle", nota: "Scadenza anteriore all'avvio del sistema"},
};
const CHIUSI = ["catena eseguita", "precedente all'avvio"];

/* ---------- utilità ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const oggi = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const daIso = s => { const [a,m,g] = s.split("-").map(Number); return new Date(a, m-1, g); };
const giorni = s => Math.round((daIso(s) - oggi()) / 864e5);
const dataIt = s => daIso(s).toLocaleDateString("it-IT", {day:"2-digit", month:"2-digit", year:"numeric"});
const distanza = g => g === 0 ? "oggi" : g === 1 ? "domani" : g > 1 ? `tra ${g} giorni` : g === -1 ? "ieri" : `${-g} giorni fa`;

/* ---------- archivio di esempio ---------- */
function ArchivioEsempio(){
  const piu = n => { const d = oggi(); d.setDate(d.getDate()+n); return iso(d); };
  const fy = "FY" + oggi().getFullYear();
  const registro = {
    avvio: piu(-10),
    incarichi: [
      {codice:"SOC_Alfa-Meccanica", denominazione:"Alfa Meccanica S.r.l.", tipo:"revisione_legale", ruolo:"Revisore legale dei conti",

/* ---------- archivio su Google Drive ----------
   Stessi metodi dell'archivio di esempio. La pagina parla direttamente con Drive dal browser:
   nessun server intermedio. Il motore su GitHub legge e scrive gli stessi file. */
const RISERVATI = ["AVVIA", "COMPLETATO", "ERRORE", "RICHIEDI", "NON-RIUSCITA"];
const riservato = nome => RISERVATI.some(p => nome.startsWith(p)) || ["incarico", "attivita"].includes(nome.split(".")[0].toLowerCase());
const dimensione = b => { b = Number(b) || 0; return b > 1048576 ? (b / 1048576).toFixed(1).replace(".", ",") + " MB" : Math.max(1, Math.round(b / 1024)) + " KB"; };
const slugAttivita = t => t.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 60) || "Attivita";
async function impronta(richieste, temi){
  const voci = [...richieste.map(v => "R:" + String(v).trim()).filter(v => v.length > 2), ...temi.map(v => "T:" + String(v).trim()).filter(v => v.length > 2)].sort();
  const h = await crypto.subtle.digest("SHA-1", new TextEncoder().encode(voci.join("\n")));
  return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, "0")).join("").slice(0, 12);
}
function ArchivioDrive(cfg){
  const API = "https://www.googleapis.com/drive/v3", UP = "https://www.googleapis.com/upload/drive/v3", CARTELLA = "application/vnd.google-apps.folder";

  const cache = new Map();
  const chiediToken = prompt => new Promise((ok, no) => { attesa = {ok, no}; client.requestAccessToken({prompt}); });
  async function api(url, opts = {}, riprova = true){
    const r = await fetch(url, {...opts, headers: {...(opts.headers || {}), Authorization: "Bearer " + token}});
    if (r.status === 401 && riprova){ await chiediToken(""); return api(url, opts, false); }
    if (!r.ok) throw new Error(`Drive ha risposto ${r.status}. ${(await r.text()).slice(0, 160)}`);
    return r;
  }
  async function figli(id){
    if (cache.has(id)) return cache.get(id);
    const files = []; let pagina = "";
    do { const r = await (await api(`${API}/files?q=${encodeURIComponent(`'${id}' in parents and trashed = false`)}&fields=${encodeURIComponent("nextPageToken, files(id, name, mimeType, size)")}&pageSize=1000${pagina ? "&pageToken=" + encodeURIComponent(pagina) : ""}`)).json();
      files.push(...(r.files || [])); pagina = r.nextPageToken || ""; } while (pagina);
    cache.set(id, files); return files;
  }
  async function cartella(percorso, crea = false){
    let id = rootId;
    for (const parte of percorso.split("/").filter(Boolean)){
      let f = (await figli(id)).find(c => c.name === parte && c.mimeType === CARTELLA);
      if (!f){ if (!crea) return null;
        f = await (await api(`${API}/files?fields=id`, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({name: parte, mimeType: CARTELLA, parents: [id]})})).json(); cache.delete(id); }
      id = f.id;
    }
    return id;
  }
  const trova = async (idCartella, nome) => idCartella ? (await figli(idCartella)).find(c => c.name === nome && c.mimeType !== CARTELLA) : null;
  const testo = async idFile => (await api(`${API}/files/${idFile}?alt=media`)).text();
  async function scrivi(idCartella, nome, contenuto, tipo){
    const corpo = contenuto instanceof Blob ? contenuto : new Blob([contenuto], {type: tipo || "text/plain"});
    const mime = corpo.type || tipo || "application/octet-stream", esiste = await trova(idCartella, nome);
    if (esiste){ await api(`${UP}/files/${esiste.id}?uploadType=media`, {method: "PATCH", headers: {"Content-Type": mime}, body: corpo}); return esiste.id; }
    const confine = "auditlab" + Math.random().toString(36).slice(2);
    const multi = new Blob([`--${confine}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({name: nome, parents: [idCartella]})}\r\n--${confine}\r\nContent-Type: ${mime}\r\n\r\n`, corpo, `\r\n--${confine}--`]);
    const r = await (await api(`${UP}/files?uploadType=multipart&fields=id`, {method: "POST", headers: {"Content-Type": `multipart/related; boundary=${confine}`}, body: multi})).json();
    cache.delete(idCartella); return r.id;
  }

  async function leggiRegistro(){

  const cartellaAttesa = async (codice, crea = false) => { const inc = await cartella(`02_Incarichi/${codice}`, crea); if (inc) cache.delete(inc); return inc ? cartella(`02_Incarichi/${codice}/${SMISTA}`, crea) : null; };
  const daMotore = s => ({data: s.data, incarico: s.incarico, attivita: s.attivita, stato: s.stato, cartella: s.cartella, straordinaria: !!s.straordinaria, ndoc: s.documenti || 0, daAggiornare: !!s.da_rivedere, proposte: s.proposte || 0,

  async function modificaJson(percorso, nome, modifica){

      if (!rootId){ const r = await (await api(`${API}/files?q=${encodeURIComponent(`name = 'Revisione' and 'root' in parents and mimeType = '${CARTELLA}' and trashed = false`)}&fields=${encodeURIComponent("files(id)")}`)).json();

    async daSmistare(codice){

      return (await figli(id)).filter(c => c.mimeType !== CARTELLA).map(c => ({id: c.id, nome: c.name, dim: dimensione(c.size), peso: Number(c.size) || 0}));
    },
    async caricaDaSmistare(codice, files){
      const id = await cartellaAttesa(codice, true); for (const file of files) await scrivi(id, file.name, file);
      cache.delete(id); const n = (await figli(id)).filter(c => c.mimeType !== CARTELLA).length;
      await aggiornaScadenzario((_, tutto) => segnaAttesa(tutto, codice, n));
    },
    async sposta(codice, idFile, percorso){
      const da = await cartellaAttesa(codice), a = await cartella(percorso, true); if (da) cache.delete(da);
      const f = da && (await figli(da)).find(c => c.id === idFile); if (!f) throw new Error("Il documento non è più tra quelli da smistare.");
      cache.delete(a); const presenti = (await figli(a)).map(c => c.name); let nome = f.name, k = 2;
      while (presenti.includes(nome)){ const punto = f.name.lastIndexOf("."); nome = punto > 0 ? `${f.name.slice(0, punto)} (${k})${f.name.slice(punto)}` : `${f.name} (${k})`; k++; }
      await api(`${API}/files/${idFile}?addParents=${a}&removeParents=${da}&fields=id`, {method: "PATCH", headers: {"Content-Type": "application/json"}, body: JSON.stringify(nome === f.name ? {} : {name: nome})});
      cache.delete(da); const restano = (await figli(da)).filter(c => c.mimeType !== CARTELLA).length, n = await contaDocumenti(a);
      await aggiornaScadenzario((_, tutto) => { segnaAttesa(tutto, codice, restano); const v = voce(percorso); if (v) v.documenti = n; });
    },
    async permanente(codice){ const esito = [];
      for (const p of PERMANENTE){ const id = await cartella(`02_Incarichi/${codice}/${p.id}`); if (id) cache.delete(id);
        esito.push({sezione: p.id, file: id ? (await figli(id)).filter(c => c.mimeType !== CARTELLA).map(c => ({id: c.id, nome: c.name, dim: dimensione(c.size)})) : []}); }
      return esito;
    },
    async scaricaId(idFile, nome){
      const a = document.createElement("a"); a.href = URL.createObjectURL(await (await api(`${API}/files/${idFile}?alt=media`)).blob()); a.download = nome; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    },
    async file(codice, idFile){
      const da = await cartellaAttesa(codice), f = da && (await figli(da)).find(c => c.id === idFile); if (!f) return null;
      const dati = await (await api(`${API}/files/${idFile}?alt=media`)).blob(); return new File([dati], f.name, {type: f.mimeType || dati.type});
    },
    async salvaRegistro(registro){ const {incarichi, ...resto} = registro; await scriviRegistro({...resto, incarichi}); },
    async attivita(percorso){
      const id = await cartella(percorso); if (!id) return {documenti: [], output: [], marcatore: null};
      cache.delete(id); const f = await figli(id), out = f.find(c => c.name === OUT && c.mimeType === CARTELLA); if (out) cache.delete(out.id);
      return {documenti: f.filter(c => c.mimeType !== CARTELLA && !riservato(c.name)).map(c => ({nome: c.name, dim: dimensione(c.size)})),
        output: out ? (await figli(out.id)).filter(c => c.mimeType !== CARTELLA && !c.name.endsWith(".json")).map(c => c.name).sort() : [],
        marcatore: ["AVVIA", "RICHIEDI"].find(m => f.some(c => c.name.startsWith(m))) || null};
    },
    async caricaDocumenti(percorso, files){
      const id = await cartella(percorso, true); for (const file of files) await scrivi(id, file.name, file);
      cache.delete(id); const n = (await figli(id)).filter(c => c.mimeType !== CARTELLA && !riservato(c.name)).length;
      await aggiornaScadenzario(() => { const v = voce(percorso); if (v) v.documenti = n; });
    },
    async salvaTesto(percorso, nome, contenuto){ await scrivi(await cartella(percorso, true), nome, contenuto, "text/plain"); },
    async avvia(percorso){
      await scrivi(await cartella(percorso, true), "AVVIA", "", "text/plain");
      await aggiornaScadenzario(() => { const v = voce(percorso); if (v){ v.stato = "in coda"; v.da_rivedere = false; } });
    },
    async generaRichiesta(percorso){ await scrivi(await cartella(percorso, true), "RICHIEDI", "", "text/plain"); },
    async aggiornaScadenza(percorso, modifiche){
      const v = voce(percorso);
      if ("data" in modifiche){
        const registro = await leggiRegistro(), inc = registro.incarichi.find(i => i.codice === v.incarico), relativa = percorso.split("/").slice(2).join("/");
        const extra = inc.attivita_extra.find(e => e.cartella === relativa);
        if (extra) extra.data = modifiche.data; else inc.date[relativa] = modifiche.data;
        await scriviRegistro(registro);
      }
      if (modifiche.richiesta && "inviata" in modifiche.richiesta)
        if (!(await modificaJson(percorso, "00_richiesta.json", d => { d.inviata_il = modifiche.richiesta.inviata; }))) throw new Error("Non trovo la richiesta nella cartella dell'attività.");
      if (modifiche.daAggiornare === false){
        const inc = (await leggiRegistro()).incarichi.find(i => i.codice === v.incarico), attuale = await impronta(inc.richieste_ricorrenti, inc.temi_noti);
        for (const nome of ["stato.json", "00_richiesta.json"]) await modificaJson(percorso, nome, d => d.impronta ? (d.impronta = attuale, true) : false);
      }
      await aggiornaScadenzario(() => { if (!v) return;
        if ("data" in modifiche) v.data = modifiche.data;
        if (modifiche.richiesta && "inviata" in modifiche.richiesta) v.richiesta_inviata = modifiche.richiesta.inviata;
        if (modifiche.daAggiornare === false) v.da_rivedere = false; });
    },
    async segnaImpatto(codice){ let n = 0;
      await aggiornaScadenzario(tutte => { for (const v of tutte) if (v.incarico === codice && ["catena eseguita", "richiesta pronta"].includes(v.stato)){ v.da_rivedere = true; n++; } }); return n; },
    async creaAttivita({incarico: codice, titolo, data, descrizione = "", guida = ""}){
      const registro = await leggiRegistro(), inc = registro.incarichi.find(i => i.codice === codice);
      const [mm, gg] = inc.chiusura.split("-").map(Number), d = daIso(data), fine = new Date(d.getFullYear(), mm - 1, gg);
      const anno = Math.max(d <= fine ? d.getFullYear() : d.getFullYear() + 1, Number(inc.esercizio));
      const base = (SU_RICHIESTA[inc.tipo] || []).find(x => x.chiave === guida), sotto = base ? base.cartella : "X_Straordinarie";
      let relativa = `FY${anno}/${sotto}/${slugAttivita(titolo)}`, n = 2;
      while (inc.attivita_extra.some(e => e.cartella === relativa)) relativa = `FY${anno}/${sotto}/${slugAttivita(titolo)}-${n++}`;
      inc.attivita_extra.push({titolo, data, cartella: relativa, descrizione, ...(base ? {guida} : {})}); await scriviRegistro(registro);
      const percorso = `02_Incarichi/${codice}/${relativa}`; await cartella(percorso, true);
      await aggiornaScadenzario(tutte => { tutte.push({data, incarico: codice, attivita: titolo, stato: "da fare", cartella: percorso, straordinaria: true, riferimento: "", richiesta_generata: null, richiesta_inviata: null, anticipata: false, documenti: 0, da_rivedere: false});
        tutte.sort((a, b) => a.data.localeCompare(b.data)); });
      return percorso;
    },
    async leggiAssistente(){ const f = await trova(await cartella(REG), "assistente.json"); try { return f ? JSON.parse(await testo(f.id)) : null; } catch (e) { return null; } },
    async salvaAssistente(dati){ await scrivi(await cartella(REG, true), "assistente.json", JSON.stringify(dati, null, 1), "application/json"); },
    async leggi(percorso, nome){ const f = await trova(await cartella(`${percorso}/${OUT}`), nome); if (!f) throw new Error("File non trovato: " + nome); return testo(f.id); },
    async scarica(percorso, nome){
      const f = await trova(await cartella(`${percorso}/${OUT}`), nome); if (!f) throw new Error("File non trovato: " + nome);
      const a = document.createElement("a"); a.href = URL.createObjectURL(await (await api(`${API}/files/${f.id}?alt=media`)).blob()); a.download = nome; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    },
  };
}

/* ---------- mini interprete Markdown (solo testo, mai HTML dell'origine) ---------- */
function markdown(sorgente){
  const righe = sorgente.replace(/\r/g, "").split("\n"); let html = "", i = 0;
  const inl = t => esc(t).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  while (i < righe.length){
    const r = righe[i];
    if (/^=== BOZZA: /.test(r)){ const titolo = r.replace(/^=== BOZZA: /, "").replace(/ ===\s*$/, ""); const corpo = []; i++;
      while (i < righe.length && !/^=== FINE BOZZA ===/.test(righe[i])) corpo.push(righe[i++]); i++;
      html += `<div class="draft"><strong>Bozza: ${esc(titolo)}</strong>\n\n${esc(corpo.join("\n").trim())}</div>`; continue; }
    const h = r.match(/^(#{1,3})\s+(.*)$/); if (h){ html += `<h${h[1].length + 1}>${inl(h[2])}</h${h[1].length + 1}>`; i++; continue; }
    if (/^\|/.test(r)){ const blocco = []; while (i < righe.length && /^\|/.test(righe[i])) blocco.push(righe[i++]);
      const celle = x => x.replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const corpo = blocco.filter(x => !/^\|[\s:|-]+\|?$/.test(x));
      html += "<table>" + corpo.map((x, n) => "<tr>" + celle(x).map(c => n ? `<td>${inl(c)}</td>` : `<th>${inl(c)}</th>`).join("") + "</tr>").join("") + "</table>"; continue; }
    if (/^\s*[-*]\s+/.test(r)){ html += "<ul>"; while (i < righe.length && /^\s*[-*]\s+/.test(righe[i])) html += `<li>${inl(righe[i++].replace(/^\s*[-*]\s+/, ""))}</li>`; html += "</ul>"; continue; }
    if (/^\s*\d+\.\s+/.test(r)){ html += "<ol>"; while (i < righe.length && /^\s*\d+\.\s+/.test(righe[i])) html += `<li>${inl(righe[i++].replace(/^\s*\d+\.\s+/, ""))}</li>`; html += "</ol>"; continue; }
    if (!r.trim()){ i++; continue; }
    const par = []; while (i < righe.length && righe[i].trim() && !/^(#{1,3}\s|\||\s*[-*]\s|\s*\d+\.\s|=== BOZZA)/.test(righe[i])) par.push(righe[i++]);
    html += `<p>${inl(par.join(" "))}</p>`;
  }
  return html;
}

const NOME_BREVE = d => d.replace(/\b(s\.?r\.?l\.?|s\.?p\.?a\.?|s\.?n\.?c\.?|s\.?a\.?s\.?|unipersonale)\b\.?/gi, "").replace(/\s+/g, " ").trim();
const classeCliente = cod => "c" + (Math.max(0, stato.dati.registro.incarichi.findIndex(i => i.codice === cod)) % 6);
function calendario(){
  const c = stato.cal, f = stato.filtro, base = oggi();
  if (!c.mese) c.mese = iso(new Date(base.getFullYear(), base.getMonth(), 1));
  const lunedi = d => { const x = new Date(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
  let inizio, fine, titolo; const primo = daIso(c.mese);
  if (c.aperto){ inizio = lunedi(primo); const ultimo = new Date(primo.getFullYear(), primo.getMonth() + 1, 0);
    fine = lunedi(ultimo); fine.setDate(fine.getDate() + 6); titolo = primo.toLocaleDateString("it-IT", {month: "long", year: "numeric"}); }
  else { inizio = lunedi(base); fine = new Date(inizio); fine.setDate(fine.getDate() + 13); titolo = "Prossime due settimane"; }
  const perGiorno = {};
  for (const s of stato.dati.scadenze){ if (s.stato === "precedente all'avvio" || (f.incarico && s.incarico !== f.incarico)) continue; (perGiorno[s.data] ||= []).push(s); }
  let celle = "";
  for (const d = new Date(inizio); d <= fine; d.setDate(d.getDate() + 1)){
    const k = iso(d), voci = perGiorno[k] || [];
    const classi = ["day", k === iso(base) ? "today" : "", c.aperto && d.getMonth() !== primo.getMonth() ? "out" : "", c.giorno === k ? "sel" : ""].join(" ");
    celle += `<div class="${classi}"><button class="num" data-giorno="${k}" aria-label="${dataIt(k)}, ${voci.length} scadenze">${d.getDate()}</button>` +
      voci.map(s => `<button class="tag ${classeCliente(s.incarico)} ${CHIUSI.includes(s.stato) ? "done" : ""} ${inRitardo(s) ? "late" : ""}" data-att="${esc(s.cartella)}" title="${esc(nomeIncarico(s.incarico))}: ${esc(s.attivita)}">${esc(NOME_BREVE(nomeIncarico(s.incarico)))}</button>`).join("") + `</div>`;
  }
  const delGiorno = c.giorno ? (perGiorno[c.giorno] || []) : null;
  return `<div class="card" style="margin-bottom:14px">
    <div class="calhead"><h2>${esc(titolo)}</h2>
      ${c.aperto ? `<button class="btn" data-cal="-1" aria-label="Mese precedente">‹</button><button class="btn" data-cal="0">Oggi</button><button class="btn" data-cal="1" aria-label="Mese successivo">›</button>` : ""}
      <button class="btn" data-caltoggle aria-expanded="${c.aperto}">${c.aperto ? "Riduci" : "Apri il mese"}</button></div>
    <div class="calgrid ${c.aperto ? "" : "short"}">${["lun","mar","mer","gio","ven","sab","dom"].map(g => `<div class="dow">${g}</div>`).join("")}${celle}</div>
    <div class="legend">${stato.dati.registro.incarichi.filter(i => !f.incarico || i.codice === f.incarico).map(i => `<span class="${classeCliente(i.codice)}"><i></i>${esc(NOME_BREVE(i.denominazione))}</span>`).join("")}</div>
    ${delGiorno ? `<div class="rows" style="border-top:1px solid var(--line)"><div class="pad small muted">Scadenze del ${dataIt(c.giorno)}</div>${delGiorno.length ? delGiorno.map(rigaScadenza).join("") : `<div class="pad muted">Nessuna scadenza in questo giorno.</div>`}</div>` : ""}
  </div>`;
}

const INSTRADAMENTO = [  // regole di massima, modificabili: prima quella che corrisponde vince

const MESI = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
function trovaData(t){
  const anno = oggi().getFullYear(); let g, m, a;
  let r = t.match(/\b(\d{1,2})[\/.-](\d{1,2})(?:[\/.-](\d{2,4}))?\b/);
  if (r){ g = +r[1]; m = +r[2]; a = r[3] ? +(r[3].length === 2 ? "20" + r[3] : r[3]) : null; }
  else { r = t.toLowerCase().match(new RegExp("\\b(\\d{1,2})°?\\s+(" + MESI.join("|") + ")(?:\\s+(\\d{4}))?")); if (!r) return null; g = +r[1]; m = MESI.indexOf(r[2]) + 1; a = r[3] ? +r[3] : null; }
  if (m < 1 || m > 12 || g < 1 || g > 31) return null;
  let d = new Date(a || anno, m - 1, g); if (!a && d < oggi()) d = new Date(anno + 1, m - 1, g); return iso(d);
}
function trovaCliente(t){ const n = t.toLowerCase(); const generiche = ["comune","fondazione","societa","società","servizi","studio"];

async function cervelloEsempio(testo, files){
  const cliente = trovaCliente(testo);
  if (/cosa scade|scadenz|a che punto|in ritardo|questa settimana/i.test(testo)){
    const aperte = stato.dati.scadenze.filter(s => !CHIUSI.includes(s.stato) && (!cliente || s.incarico === cliente.codice)).sort((a, b) => a.data.localeCompare(b.data));
    const vicine = aperte.filter(s => giorni(s.data) <= 7);
    return {testo: (vicine.length ? `Entro sette giorni${cliente ? " per " + cliente.denominazione : ""}, comprese quelle in ritardo:\n\n` + vicine.map(s => `- **${dataIt(s.data)}** ${s.attivita}, ${nomeIncarico(s.incarico)} (${s.stato}${inRitardo(s) ? ", in ritardo" : ""})`).join("\n")
      : "Nessuna scadenza aperta nei prossimi sette giorni.") + `\n\nIn tutto le scadenze aperte sono ${aperte.length}.`};
  }
  if (cliente && /parere|chied|richiest|entro|variazion|attivit|verifica straordinaria/i.test(testo)){
    const titolo = (/variazion/i.test(testo) ? "Parere sulla variazione di bilancio" : /fuori bilancio/i.test(testo) ? "Parere sul riconoscimento di debiti fuori bilancio"
      : /regolament/i.test(testo) ? "Parere sul regolamento" : /parere/i.test(testo) ? "Parere straordinario" : "Attività straordinaria") + ((testo.match(/\bn\.?\s*(\d+)/i) || [])[1] ? " n. " + testo.match(/\bn\.?\s*(\d+)/i)[1] : "");
    const trovata = trovaData(testo); let data = trovata; if (!data){ const d = oggi(); d.setDate(d.getDate() + 15); data = iso(d); }
    const mail = testo.length > 280 || /oggetto:|^da:|^from:/im.test(testo);
    const azioni = [`Creo l'attività «${titolo}» nel fascicolo di ${cliente.denominazione}`, `Scadenza ${dataIt(data)}${trovata ? "" : " (non indicata: propongo quindici giorni da oggi)"}`];
    if (mail) azioni.push("Salvo nella cartella il testo che hai incollato come «Mail ricevuta»");
    if (files.length) azioni.push(`Carico ${files.length === 1 ? "il documento allegato" : "i " + files.length + " documenti allegati"} e avvio la catena`);
    return {testo: "Ho capito così. Controlla e conferma: finché non confermi non tocco nulla su Drive.", proposta: {azioni, esegui: async () => {
      const cartella = await archivio.creaAttivita({incarico: cliente.codice, titolo, data});
      if (mail) await archivio.salvaTesto(cartella, nomeMail(), testo);
      if (files.length){ await archivio.caricaDocumenti(cartella, files); await archivio.avvia(cartella); }
      return `Fatto. «${titolo}» è nel fascicolo di ${cliente.denominazione} con scadenza ${dataIt(data)}: la trovi in Scadenze e nel calendario.`; }}};
  }
  const regola = (files.length ? INSTRADAMENTO[0] : INSTRADAMENTO.find(r => r.se.test(testo))) || {fornitore: "Claude", sforzo: "standard", url: "https://claude.ai", motivo: "Domanda generale, senza documenti da leggere."};
  return {testo: "In questa versione di esempio non c'è un modello collegato, quindi non posso rispondere nel merito. Nella versione vera qui trovi la risposta, e sotto il consiglio su dove approfondire.",
    rinvio: {...regola, richiesta: testo}};
}

const ISTRUZIONI = `Sei l'assistente operativo di un revisore legale italiano dentro AuditLab, la sua pagina di gestione degli incarichi di revisione (società, enti del Terzo settore, enti locali). Rispondi in italiano, in modo tecnico e conciso.

Regole: negli strumenti usa i codici degli incarichi e le cartelle esattamente come compaiono nei dati. Nel testo che scrivi al revisore, invece, chiama sempre gli incarichi con la denominazione (per esempio «Comune di Gamma») e non riportare mai codici con prefisso, come SOC_, VOL_, ETS_ o EL_, né percorsi di cartelle. Significato degli stati: «da fare» = richiesta documenti non ancora generata; «richiesta pronta» = richiesta già generata, da inviare al cliente se richiesta_inviata è vuoto (non proporre di generarla di nuovo: ricorda di inviarla); «in coda» = catena in avvio; «catena eseguita» = risultati da leggere. proposte_da_valutare = voci che il riesame propone di aggiungere alla scheda dell'incarico: il revisore le accoglie o le scarta nella pagina dell'incarico. documenti_da_smistare = documenti ricevuti e non ancora assegnati: si assegnano nella pagina dell'incarico. Ogni incarico ha un fascicolo permanente per i documenti che valgono per tutto il mandato: la sezione «incarico e accettazione» è solo archivio, la sezione «conoscenza del cliente» viene letta dalla catena come contesto. Se manca un'informazione necessaria (quale incarico, quale data), chiedila invece di inventarla. Le date negli strumenti sono in formato AAAA-MM-GG. Le comunicazioni ai clienti le invia sempre il revisore: tu al massimo prepari una bozza nel testo.`;

const base64 = file => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1]); r.onerror = () => no(r.error); r.readAsDataURL(file); });

async function blocchiAllegati(files){
  const blocchi = []; let peso = 0;
  for (const f of files){
    const nome = f.name.toLowerCase(); peso += f.size;
    if (peso > 20 * 1048576){ blocchi.push({type: "text", text: `[Allegato non trasmesso perché troppo pesante: ${f.name}]`}); continue; }
    if (nome.endsWith(".pdf")) blocchi.push({type: "document", source: {type: "base64", media_type: "application/pdf", data: await base64(f)}, title: f.name});
    else if (/\.(png|jpe?g|gif|webp)$/.test(nome)) blocchi.push({type: "image", source: {type: "base64", media_type: f.type || "image/jpeg", data: await base64(f)}});
    else if (/\.(txt|md|csv|json|xml|eml|html?)$/.test(nome)) blocchi.push({type: "text", text: `[Allegato ${f.name}]\n${(await f.text()).slice(0, 60000)}`});
    else blocchi.push({type: "text", text: `[Allegato di cui conosci solo il nome: ${f.name}]`});
  }
  return blocchi;
}
function azioneDa(uso, testo, files){

  const manca = t => ({testo: t + " (non eseguibile: riferimento non trovato)", fai: null});
  const dataOk = d => /^\d{4}-\d{2}-\d{2}$/.test(d || "");

async function cervelloClaude(testo, files){
  const storia = stato.chat.filter(m => !m.attesa && !m.prove).slice(0, -1).slice(-8).map(m => ({role: m.chi === "u" ? "user" : "assistant", content: m.testo || "(proposta di azioni)"}));
  while (storia.length && storia[0].role !== "user") storia.shift();
  const messaggi = []; for (const m of storia){ const u = messaggi[messaggi.length - 1]; u && u.role === m.role ? u.content += "\n\n" + m.content : messaggi.push(m); }
  if (messaggi.length && messaggi[messaggi.length - 1].role === "user") messaggi.pop();
  messaggi.push({role: "user", content: [...await blocchiAllegati(files), {type: "text", text: testo || "(Solo allegati: proponi dove archiviarli.)"}]});
  const r = await fetch("https://api.anthropic.com/v1/messages", {method: "POST",
    headers: {"content-type": "application/json", "x-api-key": stato.assistente.chiave, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true"},
    body: JSON.stringify({model: stato.assistente.modello || CONFIG.modelloAssistente || "claude-sonnet-5-5", max_tokens: 2500, system: ISTRUZIONI + "\n\nDati aggiornati della pagina:\n" + contestoPerModello(), tools: STRUMENTI, messages: messaggi})});
  if (!r.ok){ const e = await r.json().catch(() => ({})); throw new Error(r.status === 401 ? "La chiave dell'assistente non è valida o è stata revocata." : (e.error?.message || "Il modello ha risposto " + r.status)); }
  const risposta = await r.json(), usi = (risposta.content || []).filter(b => b.type === "tool_use");
  const esito = {testo: senzaCodici((risposta.content || []).filter(b => b.type === "text").map(b => b.text).join("\n\n").trim())};
  const rinvio = usi.find(u => u.name === "rinvia");
  if (rinvio) esito.rinvio = {fornitore: rinvio.input.fornitore, sforzo: rinvio.input.sforzo, motivo: rinvio.input.motivo, richiesta: rinvio.input.richiesta || testo, url: URL_CHAT[rinvio.input.fornitore] || "https://claude.ai"};
  const azioni = usi.filter(u => u.name !== "rinvia").map(u => azioneDa(u, testo, files));
  if (azioni.length){
    if (!esito.testo) esito.testo = "Ho capito così. Controlla e conferma: finché non confermi non tocco nulla su Drive.";
    esito.proposta = {azioni: azioni.map(a => a.testo), esegui: async () => { let fatte = 0;
      for (const a of azioni) if (a.fai){ await a.fai(); fatte++; stato.dati = await archivio.carica(); }
      return fatte === azioni.length ? "Fatto: la pagina e Drive sono aggiornati." : `Eseguite ${fatte} azioni su ${azioni.length}: le altre avevano riferimenti non validi.`; }};
  }
  if (!esito.testo && !rinvio) esito.testo = "Non ho una risposta utile: prova a riformulare.";
  return esito;
}
async function cervello(testo, files){
  if (archivio.esempio) return cervelloEsempio(testo, files);
  try { return await cervelloClaude(testo, files); } catch (e) { return {testo: "Non sono riuscito a ottenere una risposta. " + (e.message || e)}; }
}

function codiceDa(tipo, denominazione){
  const base = denominazione.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\b(s\.?r\.?l\.?|s\.?p\.?a\.?|s\.?n\.?c\.?|s\.?a\.?s\.?|unipersonale|ets|odv|aps)\b\.?/gi, " ")
    .replace(/[^A-Za-z0-9 ]+/g, " ").trim().split(/\s+/).filter(Boolean).slice(0, 4).join("-");
  return `${TIPI[tipo].prefisso}_${base || "Incarico"}`;
}
function righeDa(testo){ return testo.split("\n").map(x => x.trim()).filter(Boolean); }

  if (d.ok) return esitoProposta(Number(d.ok), true);
  if (d.no) return esitoProposta(Number(d.no), false);
  if (d.prova){ $("#chatTesto").value = d.prova; return $("#chatTesto").focus(); }
  if (d.copia){ const r = stato.chat[Number(d.copia)]?.rinvio; if (r) (navigator.clipboard?.writeText(r.richiesta) ?? Promise.reject()).then(() => toast("Richiesta copiata: incollala nella chat di " + r.fornitore + "."), () => toast("Copia non riuscita: seleziona il testo a mano.")); return; }
  if (d.voce){ const [c, campo, n] = d.voce.split("|"); return apriVoce(c, campo, Number(n)); }
  if (d.vocedel){ const [c, campo, n] = d.vocedel.split("|"); return chiedi("Eliminare questa voce?", "Elimina").then(si => si && cambiaVoci(c, campo, a => a.splice(Number(n), 1), "Eliminato.")); }
  if (d.prop){ const [n, esito] = d.prop.split("|"); return decidiProposta(Number(n), esito === "ok"); }
  if (d.scaricaid) return archivio.scaricaId(d.scaricaid, d.nome);
  if (d.sposta) return spostaDocumento(stato.arg, d.sposta, b.closest(".item").querySelector("select").value);
  if (d.nuovaatt) return apriNuovaAttivita(d.nuovaatt);
  if (d.att) return vai("attivita", d.att);
  if (d.inc) return vai("incarico", d.inc);
  if ("nuovo" in d) return apriIncarico(null);
  if (d.modifica) return apriIncarico(d.modifica);
  if (d.ref){ const p = d.ref.lastIndexOf(":"); return apriReferente(d.ref.slice(0, p), Number(d.ref.slice(p + 1))); }
  if (b.id === "btnGate"){ if (archivio.esempio) return apriAccesso(); archivio.esci(); return location.reload(); }
});
document.addEventListener("submit", e => { const f = e.target.closest("form[data-lista]"); if (!f) return; e.preventDefault();
  const v = f.elements.v.value.trim(); if (!v) return; const [c, campo] = f.dataset.lista.split("|"); cambiaVoci(c, campo, a => a.push(v), "Aggiunto."); });
document.addEventListener("change", e => { if (e.target.id === "fInc"){ stato.filtro.incarico = e.target.value; disegna(); } });
window.addEventListener("unhandledrejection", e => { toast("Operazione non riuscita. " + (e.reason?.message || e.reason || "")); });
if (CONFIG.clientId && !window.google?.accounts?.oauth2){ const g = document.createElement("script"); g.src = "https://accounts.google.com/gsi/client"; g.async = true; document.head.appendChild(g); }
disegna();
if (archivio) ricarica();
